# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      Project_Directory: biocs
      Test_Project_Directory: biocs/core.tests
      Coverage_Output: TestResults/mstest.xml
      Coverage_Report_Directory: TestResults/report
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ${{ env.Project_Directory }}
    - name: Build
      run: dotnet build --no-restore
      working-directory: ${{ env.Project_Directory }}
    - name: Test
      run: dotnet run --no-build
      working-directory: ${{ env.Test_Project_Directory }}
    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
      with:
        reports: ${{ env.Coverage_Output }}
        targetdir: ${{ env.Coverage_Report_Directory }}
        reporttypes: "Html;MarkdownSummaryGithub"
      working-directory: ${{ env.Test_Project_Directory }}
    - name: Publish coverage in build summary
      run: cat ${{ env.Coverage_Report_Directory }}/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      shell: bash
      working-directory: ${{ env.Test_Project_Directory }}
    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: ${{ env.Coverage_Report_Directory }}
      working-directory: ${{ env.Test_Project_Directory }}
